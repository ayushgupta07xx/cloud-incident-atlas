name: Daily incident ingest

on:
  schedule:
    # Varied times per weekday. Round-hour and on-the-hour slots are heavily
    # contended on GitHub's shared runners, so off-hour minutes are queued
    # less and dropped less often. Spreading across the week also avoids
    # colliding with the same global peak every day.
    - cron: "23 4 * * 1"   # Mon 09:53 IST
    - cron: "47 9 * * 2"   # Tue 15:17 IST
    - cron: "08 6 * * 3"   # Wed 11:38 IST
    - cron: "51 11 * * 4"  # Thu 17:21 IST
    - cron: "34 7 * * 5"   # Fri 13:04 IST
    - cron: "19 13 * * 6"  # Sat 18:49 IST
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      drift: ${{ steps.drift.outputs.detected }}
      drift_detail: ${{ steps.drift.outputs.detail }}

    steps:
      - name: Jitter
        if: github.event_name == 'schedule'
        run: sleep $(( RANDOM % 1800 ))

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch and normalize provider feeds
        run: python -m src.ingest

      - name: Surface provider drift
        id: drift
        run: |
          if [ -f drift.txt ]; then
            {
              echo "detected=true"
              echo "detail<<DRIFT_EOF"
              cat drift.txt
              echo "DRIFT_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "::warning::provider drift detected"
            cat drift.txt
          else
            echo "detected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit if upstream data changed
        env:
          # These must be YOUR account identity or the commit will not appear
          # on your contribution graph. Use the noreply alias from
          # github.com/settings/emails to avoid publishing your real address.
          GIT_AUTHOR_NAME: Ayush Gupta
          GIT_AUTHOR_EMAIL: ${{ vars.COMMIT_EMAIL }}
          GIT_COMMITTER_NAME: Ayush Gupta
          GIT_COMMITTER_EMAIL: ${{ vars.COMMIT_EMAIL }}
        run: |
          set -euo pipefail

          if [ -z "${GIT_AUTHOR_EMAIL}" ]; then
            echo "::error::COMMIT_EMAIL repo variable is unset. Commits would be"
            echo "::error::attributed to nobody and would not count. Set it at"
            echo "::error::Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

          git add data docs

          if git diff --cached --quiet; then
            echo "No upstream changes today. Nothing to commit."
            exit 0
          fi

          NEW=$(python -c "
          import json,glob,os,datetime
          f=f\"data/daily/{datetime.date.today().isoformat()}.json\"
          print(len(json.load(open(f))['new']) if os.path.exists(f) else 0)")

          CHANGED=$(python -c "
          import json,glob,os,datetime
          f=f\"data/daily/{datetime.date.today().isoformat()}.json\"
          print(len(json.load(open(f))['changed']) if os.path.exists(f) else 0)")

          git commit -m "data: ingest ${NEW} new, ${CHANGED} updated incidents" \
                     -m "Automated run of the ingest pipeline defined in this repository." \
                     -m "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                     -m "Co-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

          git push

  alert:
    needs: ingest
    if: failure() || needs.ingest.outputs.drift == 'true' 
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue so a silent break does not go unnoticed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIFT_DETAIL: ${{ needs.ingest.outputs.drift_detail }}
        run: |
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Ingest needs attention: $(date -u +%Y-%m-%d)" \
            --label automated \
            --body "Run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          \`\`\`
          ${DRIFT_DETAIL:-The job failed outright. See the run log.}
          \`\`\`

          A provider returning zero records for several consecutive runs has
          usually changed its feed shape. Reproduce with:

              python -m src.ingest --dry-run"
