name: Daily incident ingest

on:
  schedule:
    # Varied times per weekday. Round-hour and on-the-hour slots are heavily
    # contended on GitHub's shared runners, so off-hour minutes are queued
    # less and dropped less often. Spreading across the week also avoids
    # colliding with the same global peak every day.
    - cron: "23 4 * * 1"   # Mon 09:53 IST
    - cron: "47 9 * * 2"   # Tue 15:17 IST
    - cron: "08 6 * * 3"   # Wed 11:38 IST
    - cron: "51 11 * * 4"  # Thu 17:21 IST
    - cron: "34 7 * * 5"   # Fri 13:04 IST
    - cron: "19 13 * * 6"  # Sat 18:49 IST
    # TEMPORARY probe — remove after verifying the schedule fires (block 98)
    - cron: "55 23 * * 5"
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    # 25 rather than 10: the ingest itself takes ~30s, but a provider that
    # hangs rather than refusing can hold a connection near the request
    # timeout, and 25 vendors compounds that.
    timeout-minutes: 25
    outputs:
      drift: ${{ steps.drift.outputs.detected }}
      drift_detail: ${{ steps.drift.outputs.detail }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch and normalize provider feeds
        run: python -m src.ingest

      - name: Surface provider drift
        id: drift
        run: |
          if [ -f drift.txt ]; then
            {
              echo "detected=true"
              echo "detail<<DRIFT_EOF"
              cat drift.txt
              echo "DRIFT_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "::warning::provider drift detected"
            cat drift.txt
          else
            echo "detected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit if upstream data changed
        env:
          # These must be YOUR account identity or the commit will not appear
          # on your contribution graph. Use the noreply alias from
          # github.com/settings/emails to avoid publishing your real address.
          GIT_AUTHOR_NAME: Ayush Gupta
          GIT_AUTHOR_EMAIL: ${{ vars.COMMIT_EMAIL }}
          GIT_COMMITTER_NAME: Ayush Gupta
          GIT_COMMITTER_EMAIL: ${{ vars.COMMIT_EMAIL }}
        run: |
          set -euo pipefail

          if [ -z "${GIT_AUTHOR_EMAIL}" ]; then
            echo "::error::COMMIT_EMAIL repo variable is unset. Commits would be"
            echo "::error::attributed to nobody and would not count. Set it at"
            echo "::error::Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

          # Stage incident data first and test *that* for changes. The
          # baseline is bookkeeping: it must ride along with a real update,
          # never trigger one on its own.
          git add data/incidents data/daily

          if git diff --cached --quiet; then
            echo "No upstream changes today. Nothing to commit."
            git checkout -- data/baseline.json 2>/dev/null || true
            exit 0
          fi

          git add data/baseline.json data/summary.json

          # Count what THIS run staged. Reading the daily delta would report
          # every record the file holds, including earlier runs' work.
          STAT=$(git diff --cached --numstat -- data/incidents | \
                 awk '{a+=$1; d+=$2} END {printf "%d %d", a+0, d+0}')
          ADDED=$(echo "$STAT" | cut -d" " -f1)
          FILES=$(git diff --cached --name-only -- data/incidents | wc -l)

          git commit -m "data: ingest update (${ADDED} lines across ${FILES} shard(s))" \
                     -m "Automated run of the ingest pipeline defined in this repository." \
                     -m "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                     -m "Co-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

          # Second commit: generated documentation. Split from the data commit
          # because they are separate concerns - the corpus is the record, the
          # docs are a rendering of it, and either should be revertable alone.
          git add README.md docs
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh digest and charts" \
                       -m "Regenerated from the corpus by the ingest pipeline." \
                       -m "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                       -m "Co-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          fi

          git push

  alert:
    needs: ingest
    # A job killed by timeout has conclusion 'cancelled', which failure()
    # does NOT match - the first real scheduled failure (30622505998) opened
    # no issue because of this. always() is required or a cancelled
    # dependency skips this job outright.
    if: >-
      always() && (
        needs.ingest.result == 'failure' ||
        needs.ingest.result == 'cancelled' ||
        needs.ingest.outputs.drift == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Ensure the label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create automated --color ededed \
            --description "Opened automatically by a workflow" \
            --repo "${GITHUB_REPOSITORY}" --force

      - name: Skip if an alert issue is already open
        id: dedupe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Drift persists until the provider recovers, so this job fires on
          # every subsequent run. Without this check a single broken feed
          # would open one issue per run - roughly 150 over six months.
          EXISTING=$(gh issue list --repo "${GITHUB_REPOSITORY}" \
            --label automated --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "already tracked in #${EXISTING}; not opening a duplicate"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open an issue so a silent break does not go unnoticed
        if: steps.dedupe.outputs.skip == 'false' 
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIFT_DETAIL: ${{ needs.ingest.outputs.drift_detail }}
        run: |
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Ingest needs attention: $(date -u +%Y-%m-%d)" \
            --label automated \
            --body "Run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          \`\`\`
          ${DRIFT_DETAIL:-The job failed outright. See the run log.}
          \`\`\`

          A provider returning zero records for several consecutive runs has
          usually changed its feed shape. Reproduce with:

              python -m src.ingest --dry-run"
